  # =======================================================================
  # Phase 3a: formatter.ts 교체 (Biome Node.js API → oxfmt + oxlint)
  # =======================================================================

  - unit_id: U-301
    owner_role: implementation-primary
    model_hint: opus
    spawn_authority: orchestrator_only
    nested_spawn: forbidden
    escalation_path: return_to_orchestrator
    execution_mode_candidates:
      preset:
        preset_name: "implementation-primary"
        preset_file: ".agents/agents/implementation-primary.md"
      inline_fallback:
        role_id: "implementation-primary"
        role_file_ref: ".agents/workflow/subagents/00_agent_roles.md"
        prompt_file_ref: ".agents/workflow/prompts/02_implement.md"
        required_tools:
          - Read
          - Edit
          - Write
          - Bash
          - Glob
          - Grep
        objective_packet:
          objective_id: "OBJ-301"
          objective_revision: 1
          global_objective: "Sonamu 모노레포 툴체인 마이그레이션: Vite 8, Vitest 4.1.2, TypeScript 6, Oxfmt+Oxlint"
          phase_objective: "Phase 3a: formatter.ts Biome Node.js API → oxfmt + oxlint CLI 교체"
          unit_objective: |
            modules/sonamu/src/utils/formatter.ts를 다음과 같이 교체한다:

            현재 의존성: @biomejs/js-api/nodejs (Biome 클래스)
            신규 의존성: oxfmt (Node.js API), oxlint (CLI via execa)

            신규 flow (formatter.ts):
            1. import { format, type FormatOptions } from "oxfmt"
               const formatOptions: FormatOptions = {
                 printWidth: 100, tabWidth: 2, useTabs: false,
                 singleQuote: false, jsxSingleQuote: false,
                 trailingComma: "all", semi: true, endOfLine: "lf",
                 bracketSpacing: true, experimentalSortImports: true,
               };
            2. formatCode(code, parser, filePath):
               a. const result1 = await format(filePath, code, formatOptions)
               b. tmp 파일에 result1.code 저장 (crypto.randomUUID()로 유니크 파일명)
               c. execa("oxlint", ["--fix", "--fix-suggestions", tmpFilePath]) 실행
               d. tmp 파일 읽기
               e. const result2 = await format(filePath, tmpFileContent, formatOptions)
               f. tmp 파일 삭제, result2.code 반환
            3. JSON parser: filePath가 .json이면 oxfmt가 자동 감지. formatOptions에 parser 옵션 불필요.
            4. setupBiome 함수 제거 (oxfmt는 설정 불필요, 함수 호출부도 정리)
            5. formatCode를 async 함수로 변환 (현재 동기). 호출부(code-generation.ts 등) await 추가.

            oxfmt가 pnpm-workspace.yaml catalog에 추가되어 있어야 함.
            modules/sonamu/package.json에 oxfmt 의존성 추가.
            @biomejs/js-api, @biomejs/wasm-nodejs를 modules/sonamu/package.json에서 제거.

            oxfmt Node.js API 확인:
            - `import { format } from "oxfmt"` → format(filePath, source, options) → Promise<{ code: string }>
            - 실제 API가 다르면 oxfmt 패키지 타입 정의를 확인하고 그에 맞게 작성.

            formatCode 호출부 (await 추가 필요):
            - modules/sonamu/src/syncer/code-generation.ts
            - modules/sonamu/src/database/sonamu-dictionary.ts
            - modules/sonamu/src/syncer/code-generator.ts
            - modules/sonamu/src/application/entity/entity.ts
            - modules/sonamu/src/sonamu.ts
          non_goals:
            - "Biome 전체 제거 (U-302에서 처리)"
            - "ESLint 제거 (U-302에서 처리)"
            - "biome-ignore 주석 마이그레이션 (U-302에서 처리)"
            - "pnpm check 스크립트 변경 (U-302에서 처리)"
            - "생성된 파일 편집"
          success_criteria:
            - "formatter.ts가 Biome API 없이 동작함"
            - "oxfmt, execa import 사용"
            - "formatCode가 async 함수로 변환됨"
            - "모든 호출부에 await 추가됨"
            - "setupBiome 함수 및 그 호출부 제거됨"
            - "pnpm --filter sonamu build 성공"
            - "pnpm --filter sonamu test:type 성공"
            - "pnpm --filter miomock-api test 성공 (코드 생성 regression)"
          constraints:
            - "as any, as unknown as T 금지"
            - "생성된 파일 직접 편집 금지"
            - "formatCode를 동기로 유지하지 않음 (async로 변환)"
            - "temp 파일은 crypto.randomUUID()로 유니크 경로 사용"
            - "커밋 메시지: [sonamu] refactor: formatter.ts Biome Node.js API → oxfmt + oxlint CLI 교체"
          required_evidence:
            - "pnpm --filter sonamu build 성공 로그"
            - "pnpm --filter sonamu test:type 성공 로그"
            - "pnpm --filter miomock-api test 성공 로그 (코드 생성 포함)"
    must_verify_behaviors:
      - "formatCode(code, 'typescript', filePath)가 올바르게 포맷 + lint-fix된 코드를 반환함"
      - "formatCode(code, 'json', filePath)가 JSON 파일에 대해 올바르게 포맷됨"
      - "pnpm --filter miomock-api test에서 코드 생성 관련 테스트가 회귀 없이 통과"
      - "formatCode 비동기화로 인해 타입 에러가 없음 (모든 호출부에 await)"
    gate_profile:
      common_required:
        - root_pnpm_check
        - project_build
        - project_test
      project_overrides:
        modules/sonamu:
          required:
            - "pnpm --filter sonamu build"
            - "pnpm --filter sonamu test:type"
        examples/miomock/api:
          required:
            - "pnpm --filter miomock-api test"
    dependencies:
      - U-201
      - U-201-review
    parallel_group: P-3
    required_tools:
      - Read
      - Edit
      - Write
      - Bash
      - Glob
      - Grep
    required_skills: []
    review_scope: unit
    done_criteria:
      - "모든 gate_profile 항목 통과"
      - "커밋 생성됨"
      - "unit_execution_report 반환됨"


  # =======================================================================
  # Phase 3b: Biome + ESLint 전면 제거 및 Oxfmt+Oxlint 전환 완료
  # =======================================================================

  - unit_id: U-302
    owner_role: implementation-primary
    model_hint: opus
    spawn_authority: orchestrator_only
    nested_spawn: forbidden
    escalation_path: return_to_orchestrator
    execution_mode_candidates:
      preset:
        preset_name: "implementation-primary"
        preset_file: ".agents/agents/implementation-primary.md"
      inline_fallback:
        role_id: "implementation-primary"
        role_file_ref: ".agents/workflow/subagents/00_agent_roles.md"
        prompt_file_ref: ".agents/workflow/prompts/02_implement.md"
        required_tools:
          - Read
          - Edit
          - Write
          - Bash
          - Glob
          - Grep
        objective_packet:
          objective_id: "OBJ-302"
          objective_revision: 1
          global_objective: "Sonamu 모노레포 툴체인 마이그레이션: Vite 8, Vitest 4.1.2, TypeScript 6, Oxfmt+Oxlint"
          phase_objective: "Phase 3b: Biome + ESLint 전면 제거, Oxfmt + Oxlint 설정 완성"
          unit_objective: |
            다음 변경을 순서대로 수행한다:

            [1] pnpm-workspace.yaml catalog에 oxfmt, oxlint 추가; @biomejs/biome, @biomejs/js-api, @biomejs/wasm-nodejs 제거

            [2] 루트 .oxfmtrc.json 생성 (Biome 포매터 설정 이전):
                {
                  "printWidth": 100,
                  "tabWidth": 2,
                  "useTabs": false,
                  "singleQuote": false,
                  "jsxSingleQuote": false,
                  "trailingComma": "all",
                  "semi": true,
                  "endOfLine": "lf",
                  "bracketSpacing": true,
                  "experimentalSortImports": true
                }

            [3] 루트 .oxlintrc.json 생성 (biome.json linter 설정 이전):
                - 기본: "extends": ["oxlint:recommended"]
                - noUnusedImports → eslint/no-unused-vars 매핑
                - noDoubleEquals → eqeqeq: "error"
                - noFocusedTests → 해당 oxlint 규칙 확인 후 매핑
                - 비활성화된 biome a11y/style/complexity/suspicious 규칙들 → 해당 oxlint 규칙 비활성화
                - 파일 excludes: dist, build, node_modules, examples/**/web/src/services/**/*,
                  modules/create-sonamu/template (biome.json ignores와 동일)

            [4] 루트 package.json scripts 업데이트:
                - "format": "biome format --write" → "format": "oxfmt --write ."
                - "check": "biome check" → "check": "oxlint . && oxfmt --check ."
                - "check:fix": "biome check --write --unsafe" → "check:fix": "oxlint --fix --fix-suggestions . && oxfmt --write ."
                - devDependencies에서 @biomejs/biome 제거, oxfmt + oxlint 추가

            [5] 각 패키지 package.json scripts 업데이트:
                - modules/sonamu: biome 스크립트 제거 (이미 U-301에서 @biomejs/js-api 제거됨)
                - modules/cdd: "check": "biome check ..." → "check": "oxlint ... && oxfmt ..."
                - modules/hmr-hook: "lint"/"format" biome → oxlint/oxfmt
                - modules/hmr-runner: 동일
                - modules/tasks: "check"/"check:format" biome → oxlint/oxfmt
                - modules/create-sonamu: devDependencies에서 @biomejs/biome 제거
                - modules/react-components: "lint": "eslint src" → "lint": "oxlint src"
                  ESLint devDeps 제거: eslint, @typescript-eslint/*, eslint-plugin-*

            [6] modules/sonamu/ui-web:
                - .eslintrc.cjs 삭제
                - package.json에서 eslint 관련 devDependencies 제거 (있으면)

            [7] scripts/verify.ts:
                - exec("pnpm biome check") → exec("pnpm check") 두 곳 모두

            [8] create-sonamu/template 설정 이전:
                - modules/create-sonamu/template/src/biome.json 삭제
                - modules/create-sonamu/template/src/.oxfmtrc.json 생성 (위와 동일 설정)
                - modules/create-sonamu/template/src/.oxlintrc.json 생성
                - 템플릿 package.json scripts: biome → oxfmt/oxlint

            [9] biome-ignore 주석 마이그레이션:
                - 278개 biome-ignore 주석 systematic 변환
                - "biome-ignore lint/suspicious/noExplicitAny:" → "oxlint-disable-next-line no-explicit-any"
                - 기타 규칙: oxlint 동등 규칙이 있으면 변환, 없으면 주석 제거
                - biome-ignore-all → 파일 상단 oxlint-disable (해당 규칙이 있는 경우)
                - 우선순위: sonamu/src (70개), miomock/api (18개), ui-web (11개), 기타

            [10] pnpm install 실행 (lock file 갱신)

            [11] 전체 포맷 패스: pnpm format (oxfmt --write .)

            [12] 최종 검증 게이트 전부 실행
          non_goals:
            - "formatter.ts 변경 (U-301 완료됨)"
            - "react-sui 수정"
            - "생성된 파일 편집"
            - "배포 또는 마이그레이션 실행"
          success_criteria:
            - "pnpm check (oxlint + oxfmt) 루트에서 성공"
            - "pnpm --filter sonamu build 성공"
            - "pnpm --filter sonamu test:type 성공"
            - "pnpm --filter miomock-api test 성공"
            - "pnpm --filter ui-web build 성공"
            - "pnpm --filter @sonamu-kit/react-components build 성공"
            - "@biomejs/biome가 어떤 package.json에도 남아 있지 않음"
            - ".eslintrc.cjs 삭제됨"
            - "루트 .oxfmtrc.json과 .oxlintrc.json 존재함"
            - "biome-ignore 주석이 oxlint-disable 또는 제거로 대체됨"
          constraints:
            - "as any, as unknown as T 금지"
            - "생성된 파일 직접 편집 금지"
            - "react-sui 수정 금지"
            - "커밋 메시지: [*] chore: Biome + ESLint 제거 및 Oxfmt + Oxlint 전환 완료"
          required_evidence:
            - "pnpm check 성공 로그 (oxlint + oxfmt)"
            - "pnpm --filter sonamu build 성공 로그"
            - "pnpm --filter miomock-api test 성공 로그"
            - "@biomejs/biome 잔존 여부 확인 출력"
    must_verify_behaviors:
      - "pnpm check가 oxlint + oxfmt 조합으로 루트에서 통과함"
      - "biome.json이 더 이상 사용되지 않음 (삭제 또는 비활성화)"
      - "모든 패키지에서 biome 관련 스크립트가 oxfmt/oxlint로 교체됨"
      - "pnpm --filter miomock-api test 회귀 없음"
      - "react-components lint 스크립트가 oxlint로 동작함"
    gate_profile:
      common_required:
        - root_pnpm_check
        - project_build
        - project_test
      project_overrides:

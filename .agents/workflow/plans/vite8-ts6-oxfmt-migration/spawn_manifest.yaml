# Spawn Manifest: Vite 8 / TypeScript 6.0 / Oxfmt+Oxlint Migration
# All units strictly sequential. No parallel groups.

units:
  # =======================================================================
  # Phase 1: Vite 8.0.3 + Vitest 4.1.2
  # =======================================================================

  - unit_id: U-101
    owner_role: implementation-primary
    model_hint: opus
    spawn_authority: orchestrator_only
    nested_spawn: forbidden
    escalation_path: return_to_orchestrator
    execution_mode_candidates:
      preset:
        preset_name: "implementation-primary"
        preset_file: ".agents/agents/implementation-primary.md"
      inline_fallback:
        role_file_ref: ".agents/workflow/subagents/00_agent_roles.md"
        prompt_file_ref: ".agents/workflow/prompts/02_implement.md"
        role_id: "implementation-primary"
        required_tools:
          - Read
          - Edit
          - Write
          - Bash
          - Glob
          - Grep
        objective_packet:
          objective_id: "OBJ-101"
          objective_revision: 1
          global_objective: "Sonamu 모노레포 툴체인 마이그레이션: Vite 8, Vitest 4.1.2, TypeScript 6, Oxfmt+Oxlint"
          phase_objective: "Phase 1: Vite 7.3.0 → 8.0.3, Vitest ^4.0.10 → ^4.1.2"
          unit_objective: |
            다음 변경을 순서대로 수행한다:
            1. pnpm-workspace.yaml catalog 버전 업데이트:
               - vite: 7.3.0 → 8.0.3 (exact pin)
               - vitest: ^4.0.10 → ^4.1.2
               - @vitest/coverage-v8: ^4.0.12 → ^4.1.2
               - @vitejs/plugin-react: 4.7.0 → 6.0.1 (exact pin)
               - @vitejs/plugin-react-swc: ^4.1.3 → ^4.3.0
            2. modules/create-sonamu/template/src/package.json의 vite, vitest, plugin 버전 직접 업데이트 (catalog 외부)
            3. pnpm install 실행
            4. rollupOptions → rolldownOptions 변경 대상:
               - modules/react-components/vite.config.ts: rollupOptions → rolldownOptions (external만 있으므로 rename 충분)
               - examples/miomock/web/vite.config.ts: rollupOptions → rolldownOptions + manualChunks object → function form으로 변환
               - modules/create-sonamu/template/src/packages/web/vite.config.ts: 동일 패턴
               - react-sui는 EXCLUDED. rollupOptions 유지 (Vite 8 compatibility alias).
            5. manualChunks 변환 방식:
               기존: manualChunks: { "vendor-react": ["react", "react-dom"], ... }
               신규: manualChunks: (id) => { if (id.includes("react-dom") || id.includes("react")) return "vendor-react"; if (id.includes("@tanstack")) return "vendor-tanstack"; }
            6. 각 vite.config.ts에서 esbuild: key 사용 여부 확인 후 있으면 oxc: 로 변경
            7. Vitest internals 타입 호환성 확인:
               - modules/sonamu/src/testing/dev-vitest-manager.ts (createVitest, Vitest 타입)
               - modules/sonamu/src/testing/naite-vitest-reporter.ts (Reporter 타입)
               - examples/miomock/api/custom-sequencer.ts (Sequencer 타입)
               타입 에러 발생 시 Vitest 4.1 API에 맞게 수정
          non_goals:
            - "react-sui 마이그레이션"
            - "TypeScript 업그레이드 (Phase 2에서 처리)"
            - "Biome/ESLint 제거 (Phase 3에서 처리)"
            - "생성된 파일 편집 (*.generated.ts 등)"
            - "배포 또는 마이그레이션 실행"
          success_criteria:
            - "pnpm install 성공 (lock file 업데이트됨)"
            - "pnpm --filter react-components build 성공"
            - "pnpm --filter ui-web build 성공"
            - "pnpm --filter miomock-web build 성공"
            - "pnpm --filter sonamu build 성공"
            - "pnpm --filter miomock-api test 성공 (Vitest internals regression)"
            - "rollupOptions가 rolldownOptions로 변경됨 (react-components, miomock/web, template/web)"
            - "manualChunks가 function form으로 변환됨"
          constraints:
            - "as any, as unknown as T 금지"
            - "생성된 파일 직접 편집 금지"
            - "react-sui 수정 금지"
            - "pnpm check (Biome) 루트에서 통과해야 함 (Phase 3 전까지 Biome 사용)"
            - "커밋 메시지: [sonamu, miomock] chore: Vite 8.0.3 + Vitest 4.1.2 카탈로그 및 설정 마이그레이션"
          required_evidence:
            - "pnpm install 성공 로그"
            - "pnpm --filter sonamu build 성공 로그"
            - "pnpm --filter miomock-api test 성공 로그"
            - "pnpm --filter miomock-web build 성공 로그"
    must_verify_behaviors:
      - "Vite 8로 빌드된 react-components 라이브러리 번들이 생성됨"
      - "Vite 8로 빌드된 miomock-web 애플리케이션이 청크 분리되어 생성됨"
      - "Vitest 4.1.2에서 pnpm --filter miomock-api test가 회귀 없이 통과함"
      - "dev-vitest-manager.ts, naite-vitest-reporter.ts, custom-sequencer.ts 타입 에러 없음"
    gate_profile:
      common_required:
        - root_pnpm_check
        - project_build
        - project_test
      project_overrides:
        modules/sonamu:
          required:
            - "pnpm --filter sonamu build"
            - "pnpm --filter sonamu test:type"
        examples/miomock/api:
          required:
            - "pnpm --filter miomock-api test"
        modules/react-components:
          required:
            - "pnpm --filter @sonamu-kit/react-components build"
        examples/miomock/web:
          required:
            - "pnpm --filter miomock-web build"
        modules/sonamu/ui-web:
          required:
            - "pnpm --filter ui-web build"
    dependencies: []
    parallel_group: P-1
    required_tools:
      - Read
      - Edit
      - Write
      - Bash
      - Glob
      - Grep
    required_skills: []
    review_scope: unit
    done_criteria:
      - "모든 gate_profile 항목 통과"
      - "커밋 생성됨"
      - "unit_execution_report 반환됨"

